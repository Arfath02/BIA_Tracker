limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /etc/bia-tls/fullchain.pem;
  ssl_certificate_key /etc/bia-tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 32k;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  location = /api/login {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }
  location = /api/password {
    limit_req zone=login burst=5 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 30s;
  }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 30s;
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
