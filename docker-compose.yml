name: bia-transformation
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bia_sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      bia_network:
        aliases:
          - sqlserver
          - bia_sqlserver
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1,1433 -U ${MSSQL_USERNAME:-sa} -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S 127.0.0.1,1433 -U ${MSSQL_USERNAME:-sa} -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\"" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: bia_api
    environment:
      - MSSQL_SERVER=sqlserver
      - MSSQL_DATABASE=${MSSQL_DATABASE}
      - MSSQL_USERNAME=${MSSQL_USERNAME}
      - MSSQL_PASSWORD=${MSSQL_PASSWORD}
      - MSSQL_PORT=1433
      - MSSQL_DRIVER=${MSSQL_DRIVER:-ODBC Driver 18 for SQL Server}
      - MSSQL_ENCRYPT=yes
      - MSSQL_TRUST_CERT=yes
      - DATABASE_URL=mssql+pyodbc://${MSSQL_USERNAME}:${MSSQL_PASSWORD}@sqlserver:1433/${MSSQL_DATABASE}?driver=${MSSQL_DRIVER:-ODBC Driver 18 for SQL Server}&Encrypt=yes&TrustServerCertificate=yes
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS}
      - BIA_TESTING=1
    restart: unless-stopped
    networks:
      bia_network:
        aliases:
          - api
          - bia_api
    depends_on:
      sqlserver:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)" ]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: bia_web
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - ./deploy/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      bia_network:
        aliases:
          - web
          - bia_web
    depends_on:
      api:
        condition: service_healthy

volumes:
  mssql_data:
    driver: local

networks:
  bia_network:
    driver: bridge
